spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:surtidor_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    nombre: ${ADMIN_NOMBRE}
    apellido: ${ADMIN_APELLIDO}
    ci: ${ADMIN_CI}
  worker:
    username: ${WORKER_USERNAME}
    password: ${WORKER_PASSWORD}
    nombre: ${WORKER_NOMBRE}
    apellido: ${WORKER_APELLIDO}
    ci: ${WORKER_CI}